<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbf8">
  <title>Dollar TL</title>
  <link rel="stylesheet" href="/app/app.css">
  <link rel="stylesheet" href="/app/icons.css">
  <link rel="stylesheet" href="/app/ui-polish.css">
  <link rel="stylesheet" href="/app/card-upgrade.css">
  <link rel="stylesheet" href="/app/interaction-upgrade.css">
  <link rel="stylesheet" href="/app/feature-upgrades.css">
  <link rel="stylesheet" href="/app/referral-page.css">
  <link rel="stylesheet" href="/app/onboarding.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@1.27.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Dollar TL home">
        <img class="brand-mark" src="/app/logo.png" alt="">
        <span class="brand-copy">
          <strong>Dollar TL</strong>
        </span>
      </button>
      <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notifications">
        <i data-lucide="bell" aria-hidden="true"></i>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
    </header>

    <div id="previewBanner" class="preview-banner" hidden>
      Preview mode — open from Telegram to load your real Dollar TL data.
    </div>

    <main id="viewRoot" class="view-root" tabindex="-1">
      <section class="page loading-page" aria-label="Loading">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-card tall"></div>
        <div class="skeleton skeleton-button"></div>
        <div class="skeleton skeleton-card"></div>
      </section>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation"></nav>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="sheetRoot"></div>
  </div>

  <input id="novelFilePicker" type="file" accept=".txt,.epub,text/plain,application/epub+zip" hidden>
  <script src="/app/icons.js"></script>
  <script src="/app/locale-sync.js"></script>
  <script src="/app/ui-polish.js"></script>
  <script src="/app/i18n-complete.js"></script>
  <script src="/app/i18n-inline-fixes.js"></script>
  <script src="/app/i18n-wizard.js"></script>
  <script src="/app/language-display-fix.js"></script>
  <script src="/app/card-upgrade.js"></script>
  <script src="/app/interaction-upgrade.js"></script>
  <script src="/app/arrow-upgrade.js"></script>
  <script src="/app/cover-ui.js"></script>
  <script src="/app/referrals-ui.js"></script>
  <script src="/app/onboarding-ui.js"></script>
  <script src="/app/onboarding-interactions-fix.js"></script>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
