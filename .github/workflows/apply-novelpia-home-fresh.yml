name: Apply NovelPia Homepage Fresh

permissions:
  contents: write

on:
  push:
    branches:
      - agent/novelpia-descriptor-resolver
    paths:
      - 'scripts/apply-novelpia-home-fresh.mjs'
      - '.github/workflows/apply-novelpia-home-fresh.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/novelpia-descriptor-resolver
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: node scripts/apply-novelpia-home-fresh.mjs
      - name: Commit branch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use NovelPia homepage Fresh loader"
          git push origin HEAD:agent/novelpia-descriptor-resolver
