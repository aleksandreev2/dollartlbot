name: Admin Browser Smoke

on:
  pull_request:
    paths:
      - 'public/app/admin-*.js'
      - 'public/app/app.css'
      - 'public/app/ui-polish.css'
      - 'public/app/card-upgrade.css'
      - 'public/app/feature-upgrades.css'
      - 'public/app/account-page.css'
      - 'public/app/notifications-ui.js'
      - 'public/app/notifications-ui.css'
      - 'public/app/referrals-ui.js'
      - 'public/app/referral-page.css'
      - 'public/app/interaction-upgrade.js'
      - 'public/app/interaction-upgrade.css'
      - 'public/app/home-v2.css'
      - 'public/app/desktop.css'
      - 'public/app/desktop-v2.css'
      - 'public/app/telegram-desktop.css'
      - 'public/app/novel-detail.css'
      - 'public/app/language-switch.css'
      - 'public/app/app-core.js'
      - 'public/app/view-i18n.js'
      - 'public/app/suggest-content-picker.js'
      - 'public/app/suggest-content-picker.css'
      - 'public/app/suggest-content-api.js'
      - 'public/app/view-home.js'
      - 'public/app/view-queue.js'
      - 'public/app/view-suggest.js'
      - 'public/app/view-requests-account.js'
      - 'tests/admin-runtime.spec.mjs'
      - 'tests/miniapp-sheets.spec.mjs'
      - 'tests/miniapp-responsive.spec.mjs'
      - 'tests/live-translation-detail.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/admin-browser-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/admin-*.js'
      - 'public/app/app.css'
      - 'public/app/ui-polish.css'
      - 'public/app/card-upgrade.css'
      - 'public/app/feature-upgrades.css'
      - 'public/app/account-page.css'
      - 'public/app/notifications-ui.js'
      - 'public/app/notifications-ui.css'
      - 'public/app/referrals-ui.js'
      - 'public/app/referral-page.css'
      - 'public/app/interaction-upgrade.js'
      - 'public/app/interaction-upgrade.css'
      - 'public/app/home-v2.css'
      - 'public/app/desktop.css'
      - 'public/app/desktop-v2.css'
      - 'public/app/telegram-desktop.css'
      - 'public/app/novel-detail.css'
      - 'public/app/language-switch.css'
      - 'public/app/app-core.js'
      - 'public/app/view-i18n.js'
      - 'public/app/suggest-content-picker.js'
      - 'public/app/suggest-content-picker.css'
      - 'public/app/suggest-content-api.js'
      - 'public/app/view-home.js'
      - 'public/app/view-queue.js'
      - 'public/app/view-suggest.js'
      - 'public/app/view-requests-account.js'
      - 'tests/admin-runtime.spec.mjs'
      - 'tests/miniapp-sheets.spec.mjs'
      - 'tests/miniapp-responsive.spec.mjs'
      - 'tests/live-translation-detail.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/admin-browser-smoke.yml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Admin runtime browser smoke tests
        run: npm run test:admin-browser
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-smoke-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
