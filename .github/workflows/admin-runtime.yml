name: Admin Runtime

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  admin-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check admin runtime
        run: node --check public/app/admin-runtime.js
      - name: Syntax check admin entry
        run: node --check public/app/view-admin.js
      - name: Audit admin runtime architecture
        run: node scripts/audit-admin-runtime.mjs
