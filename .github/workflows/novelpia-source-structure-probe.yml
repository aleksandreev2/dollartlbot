name: NovelPia Source Structure Probe

on:
  push:
    branches:
      - agent/novelpia-descriptor-resolver
    paths:
      - 'scripts/probe-novelpia-source-structure.mjs'
      - '.github/workflows/novelpia-source-structure-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current NovelPia HTML
        run: node scripts/probe-novelpia-source-structure.mjs
