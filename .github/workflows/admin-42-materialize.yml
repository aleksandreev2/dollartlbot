name: Admin 4.2 Materialize

on:
  push:
    branches: [agent/admin-4-2-queue-pagination]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-4-2-queue-pagination
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply backend patch
        run: |
          node scripts/admin-42-materialize.mjs
          node --check public/app/admin-data-v2.js
          node --check scripts/audit-admin-data-integrity.mjs
      - name: Remove materializer and commit
        run: |
          rm scripts/admin-42-materialize.mjs
          rm .github/workflows/admin-42-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Admin 4.2 backend changes"
          git push origin HEAD:agent/admin-4-2-queue-pagination
