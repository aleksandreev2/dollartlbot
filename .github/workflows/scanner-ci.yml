name: File Security Scanner

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner dependencies
        working-directory: scanner
        run: npm install
      - name: Typecheck scanner Worker
        working-directory: scanner
        run: npm run typecheck
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Compile scanner service
        working-directory: scanner/container
        run: go test ./...
      - name: Validate scanner shell
        run: sh -n scanner/container/start.sh
      - name: Validate security extension JavaScript
        run: node --check public/app/admin-regional-access.js
