name: Request Identity & Following

on:
  pull_request:
    paths:
      - 'src/request-identity.ts'
      - 'src/title-following.ts'
      - 'src/admin-state.ts'
      - 'src/index.ts'
      - 'migrations/0028_request_identity_following.sql'
      - 'public/app/title-following-ui.js'
      - 'public/app/title-following-ui.css'
      - 'public/app/index.html'
      - 'scripts/audit-request-identity-following.mjs'
      - 'tests/request-identity-following.spec.mjs'
      - '.github/workflows/request-identity-following.yml'
  push:
    branches: [main]
    paths:
      - 'src/request-identity.ts'
      - 'src/title-following.ts'
      - 'src/admin-state.ts'
      - 'src/index.ts'
      - 'migrations/0028_request_identity_following.sql'
      - 'public/app/title-following-ui.js'
      - 'public/app/title-following-ui.css'
      - 'public/app/index.html'
      - 'scripts/audit-request-identity-following.mjs'
      - 'tests/request-identity-following.spec.mjs'
      - '.github/workflows/request-identity-following.yml'

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prepare:vendor
      - name: TypeScript
        run: npm run typecheck
      - name: Identity and following audit
        run: node scripts/audit-request-identity-following.mjs
      - name: Validate full D1 migration chain
        run: npx wrangler d1 migrations apply DB --local
      - name: Check following runtime syntax
        run: node --check public/app/title-following-ui.js
      - name: Verify assets are wired
        run: |
          test -f public/app/title-following-ui.js
          test -f public/app/title-following-ui.css
          test -f migrations/0028_request_identity_following.sql
          grep -q '/app/title-following-ui.js?v=20260812-follow1' public/app/index.html
          grep -q '/app/title-following-ui.css?v=20260812-follow1' public/app/index.html
