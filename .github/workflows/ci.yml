name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare pinned frontend vendor assets
        run: npm run prepare:vendor
      - run: npm run typecheck
      - name: Audit admin submission state machine
        run: node scripts/audit-admin-state.mjs
      - name: Audit backend safety invariants
        run: node scripts/audit-backend-safety.mjs
      - name: Audit frontend stability invariants
        run: node scripts/audit-frontend-stability.mjs
      - name: Audit notification center UX
        run: node scripts/audit-notification-ui.mjs
      - name: Audit notification delivery reliability
        run: node scripts/audit-notification-delivery.mjs
      - name: Audit Suggest content picker UX
        run: node scripts/audit-suggest-content-picker.mjs
      - name: Audit Mini App live update UX
        run: node scripts/audit-live-update-ui.mjs
      - name: Audit modular Mini App shell
        run: node scripts/audit-app-modules.mjs
      - name: Audit shared Mini App i18n runtime
        run: node scripts/audit-i18n-shared-runtime.mjs
      - name: Audit EPUB resource safety
        run: node scripts/audit-epub-safety.mjs
      - name: Audit submission intake reliability
        run: node scripts/audit-submission-intake.mjs
      - name: Audit Telegram transport reliability
        run: node scripts/audit-telegram-transport.mjs
      - name: Audit broadcast delivery reliability
        run: node scripts/audit-broadcast-delivery.mjs
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
      - name: Check Mini App JavaScript syntax
        run: |
          node --check public/app/app.js
          node --check public/app/app-update.js
          node --check public/app/app-core.js
          node --check public/app/notification-deeplink.js
          node --check public/app/view-i18n.js
          node --check public/app/view-home.js
          node --check public/app/view-queue.js
          node --check public/app/view-suggest.js
          node --check public/app/suggest-content-picker.js
          node --check public/app/view-requests-account.js
          node --check public/app/view-admin.js
          node --check public/app/performance.js
          node --check public/app/telegram-desktop.js
          node --check public/app/vendor/lucide.min.js
          node --check public/app/icons.js
          node --check public/app/i18n-core.js
          node --check public/app/i18n-runtime-v2.js
          node --check public/app/novel-presenter.js
          node --check public/app/interaction-upgrade.js
          node --check public/app/cover-ui.js
          node --check public/app/referrals-ui.js
          node --check public/app/onboarding-ui.js
          node --check public/app/notifications-ui.js
          node --check public/app/admin-cache.js
          node --check public/app/admin-console.js
          node --check public/app/admin-tools.js
          node --check public/app/admin-publishing.js
          node --check public/app/quota-unlimited-ui.js
          node --check public/app/home-v2.js
      - name: Verify publishing, desktop and locale assets
        run: |
          test -f public/app/admin-console.css
          test -f public/app/admin-tools.css
          test -f public/app/admin-publishing.css
          test ! -e public/app/admin-v2.css
          test ! -e public/app/admin-v3.css
          test ! -e public/app/admin-performance-v3.css
          test ! -e public/app/publishing-fixes.css
          test ! -e public/app/publication-management.css
          test -f public/app/desktop.css
          test -f public/app/desktop-v2.css
          test -f public/app/quota-unlimited-ui.css
          test -f public/app/telegram-desktop.css
          test -f public/app/admin-cache.js
          test -f public/app/admin-console.js
          test -f public/app/admin-tools.js
          test -f public/app/admin-publishing.js
          test -f public/app/app-core.js
          test -f public/app/app-update.js
          test -f public/app/file-picked-fix.css
          test -f public/app/notification-deeplink.js
          test -f public/app/view-i18n.js
          test -f public/app/view-home.js
          test -f public/app/view-queue.js
          test -f public/app/view-suggest.js
          test -f public/app/suggest-content-picker.js
          test -f public/app/suggest-content-picker.css
          test -f public/app/view-requests-account.js
          test -f public/app/view-admin.js
          test ! -e public/app/admin-v2.js
          test ! -e public/app/admin-v3.js
          test ! -e public/app/admin-performance-v3.js
          test ! -e public/app/publishing-fixes.js
          test ! -e public/app/publication-management.js
          test ! -e public/app/publishing-comments-ui.js
          test ! -e public/app/onboarding-interactions-fix.js
          grep -q '/app/app-core.js?v=20260810-app1' public/app/index.html
          grep -q '/app/app-update.js?v=20260810-update1' public/app/index.html
          grep -q '/app/file-picked-fix.css?v=20260810-file1' public/app/index.html
          grep -q '/app/notification-deeplink.js?v=20260810-notify1' public/app/index.html
          grep -q '/app/view-i18n.js?v=20260810-app2' public/app/index.html
          grep -q '/app/view-home.js?v=20260810-app2' public/app/index.html
          grep -q '/app/view-queue.js?v=20260810-app3' public/app/index.html
          grep -q '/app/view-suggest.js?v=20260810-app2' public/app/index.html
          grep -q '/app/suggest-content-picker.css?v=20260810-content1' public/app/index.html
          grep -q '/app/suggest-content-picker.js?v=20260810-content1' public/app/index.html
          grep -q '/app/view-requests-account.js?v=20260810-app3' public/app/index.html
          grep -q '/app/view-admin.js?v=20260810-app1' public/app/index.html
          grep -q '/app/novel-presenter.js?v=20260810-runtime4' public/app/index.html
          grep -q '/app/cover-ui.js?v=20260810-runtime4' public/app/index.html
          grep -q '/app/referrals-ui.js?v=20260810-runtime4' public/app/index.html
          grep -q '/app/onboarding-ui.js?v=20260810-runtime4' public/app/index.html
          grep -q '/app/home-v2.js?v=20260810-runtime4' public/app/index.html
          grep -q '/app/notifications-ui.css?v=20260810-notify3' public/app/index.html
          grep -q '/app/notifications-ui.js?v=20260810-notify3' public/app/index.html
          ! grep -q '/app/onboarding-interactions-fix.js' public/app/index.html
          grep -q '/app/admin-console.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-tools.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-publishing.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-console.js?v=20260810-admin1' public/app/index.html
          grep -q '/app/admin-tools.js?v=20260810-admin1' public/app/index.html
          grep -q '/app/admin-publishing.js?v=20260810-admin1' public/app/index.html
          grep -q '/app/admin-cache.js?v=20260810-admin1' public/app/index.html
          ! grep -q '/app/admin-v2.js' public/app/index.html
          ! grep -q '/app/admin-v3.js' public/app/index.html
          ! grep -q '/app/admin-performance-v3.js' public/app/index.html
          ! grep -q '/app/publishing-fixes.js' public/app/index.html
          ! grep -q '/app/publication-management.js' public/app/index.html
          test -f public/app/notifications-ui.css
          test -f public/app/i18n-core.js
          test -f public/app/i18n-runtime-v2.js
          test -f public/app/language-switch.css
          test -f public/app/novel-presenter.js
          test -f public/app/home-v2.js
          test -f public/app/home-v2.css
          test -f public/app/vendor/lucide.min.js
          grep -q '@license lucide v1.27.0' public/app/vendor/lucide.min.js
          grep -q '"lucide": "1.27.0"' package.json
          grep -q 'node scripts/prepare-vendor.mjs' wrangler.jsonc
          grep -q '/app/vendor/lucide.min.js?v=1.27.0' public/app/index.html
          ! grep -q 'unpkg.com/lucide' public/app/index.html
          test ! -e public/app/cover-reliability.js
          test ! -e public/app/i18n-wizard.js
          test ! -e public/app/i18n-complete.js
          test ! -e public/app/ui-polish.js
          test -f migrations/0014_broadcast_recipients.sql
          test -f migrations/0015_notification_delivery_state.sql
      - name: Audit Mini App localization coverage
        run: |
          node scripts/audit-miniapp-i18n.mjs
          node scripts/audit-home-v2.mjs
