name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Audit admin submission state machine
        run: node scripts/audit-admin-state.mjs
      - name: Audit backend safety invariants
        run: node scripts/audit-backend-safety.mjs
      - name: Audit frontend stability invariants
        run: node scripts/audit-frontend-stability.mjs
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
      - name: Check Mini App JavaScript syntax
        run: |
          node --check public/app/app.js
          node --check public/app/performance.js
          node --check public/app/telegram-desktop.js
          node --check public/app/icons.js
          node --check public/app/locale-sync.js
          node --check public/app/ui-polish.js
          node --check public/app/i18n-complete.js
          node --check public/app/i18n-inline-fixes.js
          node --check public/app/i18n-wizard.js
          node --check public/app/i18n-runtime-v2.js
          node --check public/app/language-display-fix.js
          node --check public/app/card-upgrade.js
          node --check public/app/interaction-upgrade.js
          node --check public/app/arrow-upgrade.js
          node --check public/app/cover-ui.js
          node --check public/app/cover-reliability.js
          node --check public/app/referrals-ui.js
          node --check public/app/onboarding-ui.js
          node --check public/app/onboarding-interactions-fix.js
          node --check public/app/admin-v2.js
          node --check public/app/admin-v3.js
          node --check public/app/admin-performance-v3.js
          node --check public/app/quota-unlimited-ui.js
          node --check public/app/publishing-fixes.js
          node --check public/app/publishing-comments-ui.js
          node --check public/app/publication-management.js
          node --check public/app/notifications-ui.js
          node --check public/app/home-v2.js
      - name: Verify publishing, desktop and locale assets
        run: |
          test -f public/app/admin-v2.css
          test -f public/app/admin-v3.css
          test -f public/app/admin-performance-v3.css
          test -f public/app/desktop.css
          test -f public/app/desktop-v2.css
          test -f public/app/quota-unlimited-ui.css
          test -f public/app/telegram-desktop.css
          test -f public/app/publishing-fixes.css
          test -f public/app/publishing-fixes.js
          test -f public/app/publishing-comments-ui.js
          test -f public/app/publication-management.js
          test -f public/app/publication-management.css
          test -f public/app/notifications-ui.css
          test -f public/app/i18n-runtime-v2.js
          test -f public/app/language-switch.css
          test -f public/app/home-v2.js
          test -f public/app/home-v2.css
          grep -q '/app/desktop-v2.css' public/app/index.html
          grep -q '/app/admin-v3.js' public/app/index.html
          grep -q '/app/admin-performance-v3.js' public/app/index.html
          grep -q '/app/cover-reliability.js' public/app/index.html
          grep -q '/app/quota-unlimited-ui.js' public/app/index.html
          grep -q '/app/publishing-comments-ui.js' public/app/index.html
          grep -q '/app/publication-management.js' public/app/index.html
          grep -q '/app/publication-management.css' public/app/index.html
          grep -q '/app/i18n-runtime-v2.js' public/app/index.html
          grep -q '/app/language-switch.css' public/app/index.html
          grep -q '/app/home-v2.js' public/app/index.html
          grep -q '/app/home-v2.css' public/app/index.html
          test -f migrations/0008_admin_publishing_notifications.sql
          test -f migrations/0009_publication_image_spoiler.sql
          test -f migrations/0010_publication_logs.sql
          test -f migrations/0011_admin_users_reliability.sql
          test -f migrations/0012_source_url_safety.sql
      - name: Audit Mini App localization coverage
        run: |
          node scripts/audit-miniapp-i18n.mjs
          node scripts/audit-home-v2.mjs
