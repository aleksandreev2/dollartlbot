          grep -q '/app/notifications-ui.css?v=20260811-notify4' public/app/index.html
          grep -q '/app/notifications-ui.js?v=20260811-notify4' public/app/index.html
          ! grep -q '/app/onboarding-interactions-fix.js' public/app/index.html
          grep -q '/app/admin-console.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-health.css?v=20260811-health1' public/app/index.html
          grep -q '/app/admin-health.js?v=20260811-health1' public/app/index.html
          grep -q '/app/admin-tools.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-users-control.css?v=20260810-users1' public/app/index.html
          grep -q '/app/admin-request-ops.css?v=20260811-ops2' public/app/index.html
          grep -q '/app/admin-request-ops.js?v=20260811-ops2' public/app/index.html
          grep -q '/app/admin-activity.css?v=20260810-adminactivity1' public/app/index.html
          grep -q '/app/admin-activity.js?v=20260810-adminactivity1' public/app/index.html
          grep -q '/app/admin-publishing.css?v=20260810-app1' public/app/index.html
          grep -q '/app/admin-publishing-view.js?v=20260811-view2' public/app/index.html
