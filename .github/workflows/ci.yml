          grep -q '/app/publication-template-ui.js?v=20260811-pubtemplate3' public/app/index.html
          grep -q '/app/publication-release-range.css?v=20260811-release1' public/app/index.html
          grep -q '/app/publication-release-range.js?v=20260811-release1' public/app/index.html
          grep -q '/app/publication-stability-ui.css?v=20260810-pubstable1' public/app/index.html
          grep -q '/app/publication-stability-ui.js?v=20260810-pubstable1' public/app/index.html
          grep -q '/app/admin-console.js?v=20260811-admin2&routes=20260811f' public/app/index.html
          grep -q '/app/admin-tools.js?v=20260810-users1' public/app/index.html
          grep -q '/app/admin-publishing.js?v=20260810-admin1' public/app/index.html
          grep -q '/app/admin-cache.js?v=20260810-admin1' public/app/index.html
          ! grep -q '/app/admin-v2.js' public/app/index.html
          ! grep -q '/app/admin-v3.js' public/app/index.html
          ! grep -q '/app/admin-performance-v3.js' public/app/index.html
          ! grep -q '/app/publishing-fixes.js' public/app/index.html
          ! grep -q '/app/publication-management.js' public/app/index.html
          test -f public/app/notifications-ui.css
          test -f public/app/i18n-core.js
          test -f public/app/i18n-runtime-v2.js
          test -f public/app/language-switch.css
