name: NovelPia Homepage Live Probe

on:
  pull_request:
    paths:
      - 'src/novelpia-homepage-fresh.ts'
      - '.github/workflows/novelpia-homepage-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe main_v2 curation variants
        shell: bash
        run: |
          node <<'NODE'
          const origin='https://novelpia.com';
          const headers={accept:'application/json,text/plain,*/*','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','user-agent':'Mozilla/5.0 DollarTL-LiveProbe/4.0','x-requested-with':'XMLHttpRequest'};
          const variants=[];
          for(const cmd of ['basic_curation','new_novel_curation']){
            for(const main_group of ['', '68','70']){
              for(const novel_category of ['entry','complete'])variants.push({cmd,main_group,novel_category});
            }
          }
          for(const v of variants){
            const u=new URL('/proc/main_v2',origin);
            u.searchParams.set('cmd',v.cmd);
            if(v.main_group)u.searchParams.set('main_group',v.main_group);
            u.searchParams.set('novel_category',v.novel_category);
            try{
              const r=await fetch(u,{headers,redirect:'follow'});const raw=await r.text();
              let data=null;try{data=JSON.parse(raw);}catch{}
              const conf=data?.conf||{};const list=Array.isArray(data?.list)?data.list:[];
              console.log('VARIANT',JSON.stringify(v),'HTTP',r.status,'API_STATUS',data?.status,'SUB',conf.sub_title,'TITLE',conf.title,'IDX',conf.idx,'LIST',list.length,'FIRST',list.slice(0,3).map(x=>({novel_no:x.novel_no,novel_name:x.novel_name,writer_nick:x.writer_nick,link_url:x.link_url})),'RAW_HEAD',data?undefined:raw.slice(0,240));
            }catch(e){console.log('ERROR',JSON.stringify(v),String(e));}
          }
          NODE
