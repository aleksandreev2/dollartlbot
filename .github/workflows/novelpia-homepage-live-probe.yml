name: NovelPia Homepage Live Probe

on:
  pull_request:
    paths:
      - 'src/novelpia-homepage-fresh.ts'
      - '.github/workflows/novelpia-homepage-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect live homepage client loader
        shell: bash
        run: |
          node <<'NODE'
          const origin='https://novelpia.com';
          const headers={accept:'text/html,application/xhtml+xml,*/*;q=0.8','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','user-agent':'Mozilla/5.0 DollarTL-LiveProbe/2.0'};
          const r=await fetch(`${origin}/`,{headers,redirect:'follow'});
          const html=await r.text();
          console.log('HOMEPAGE',r.status,html.length,'hasFreshHeading=',html.includes('따끈따끈 신규 작품'));
          const scriptUrls=[];
          for(const m of html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)){
            try{const u=new URL(m[1],origin).toString();if(!scriptUrls.includes(u))scriptUrls.push(u);}catch{}
          }
          console.log('SCRIPT_URLS',scriptUrls.length,scriptUrls);
          const needles=['curation','신규','novel_no','novelNo','main_novel','cr-novel','entry/date','freestory/new','top100','ajax','/proc/','/api/'];
          let hits=0;
          for(const url of scriptUrls.slice(0,40)){
            try{
              const sr=await fetch(url,{headers:{...headers,accept:'*/*'},redirect:'follow'});
              if(!sr.ok){console.log('SCRIPT_FAIL',sr.status,url);continue;}
              const body=await sr.text();
              const lower=body.toLowerCase();
              const local=[];
              for(const needle of needles){
                const at=lower.indexOf(needle.toLowerCase());
                if(at>=0)local.push({needle,at,snippet:body.slice(Math.max(0,at-500),Math.min(body.length,at+1200)).replace(/\s+/g,' ')});
              }
              if(local.length){
                hits+=1;
                console.log('SCRIPT_HIT',url,'len',body.length);
                for(const hit of local.slice(0,8))console.log('HIT',hit.needle,hit.at,hit.snippet);
              }
            }catch(e){console.log('SCRIPT_ERROR',url,String(e));}
          }
          console.log('HIT_SCRIPTS',hits);
          if(!scriptUrls.length)throw new Error('No client scripts discovered');
          NODE
