name: NovelPia Homepage Live Probe

on:
  pull_request:
    paths:
      - 'src/novelpia-homepage-fresh.ts'
      - '.github/workflows/novelpia-homepage-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect homepage curation API arguments
        shell: bash
        run: |
          node <<'NODE'
          const origin='https://novelpia.com';
          const headers={accept:'text/html,application/xhtml+xml,*/*;q=0.8','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','user-agent':'Mozilla/5.0 DollarTL-LiveProbe/3.0'};
          const r=await fetch(`${origin}/`,{headers,redirect:'follow'});
          const html=await r.text();
          console.log('HOMEPAGE',r.status,html.length);
          for(const needle of ['new_novel_curation','basic-v2-curation','basic_v2_curation','main_group','main-group']){
            let from=0,count=0;
            while(count<10){
              const at=html.indexOf(needle,from);if(at<0)break;
              console.log('HOME_HIT',needle,at,html.slice(Math.max(0,at-700),Math.min(html.length,at+1400)).replace(/\s+/g,' '));
              from=at+needle.length;count++;
            }
          }
          const componentUrl=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']*basic_v2_curation\.js[^"']*)["']/gi)].map(m=>new URL(m[1],origin).toString())[0];
          console.log('COMPONENT_URL',componentUrl);
          if(componentUrl){
            const cr=await fetch(componentUrl,{headers:{...headers,accept:'*/*'}});const js=await cr.text();
            for(const needle of ['main_group','new_novel_curation','/proc/main_v2']){
              const at=js.indexOf(needle);console.log('COMPONENT_HIT',needle,at,at>=0?js.slice(Math.max(0,at-900),Math.min(js.length,at+1800)).replace(/\s+/g,' '):'');
            }
          }
          NODE
