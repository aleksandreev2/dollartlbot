name: Apply Discover Fresh Fix

permissions:
  contents: write

on:
  push:
    branches:
      - agent/fix-discover-fresh
    paths:
      - 'scripts/apply-discover-fix.mjs'
      - '.github/workflows/apply-discover-fix.yml'

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-discover-fresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production fix
        run: node scripts/apply-discover-fix.mjs
      - name: Commit branch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Discover Fresh ingestion and refresh UX [apply-done]"
          git push origin HEAD:agent/fix-discover-fresh
