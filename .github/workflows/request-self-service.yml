name: Request Self-Service

on:
  pull_request:
    paths:
      - 'src/request-self-service.ts'
      - 'src/request-self-service-finalize.ts'
      - 'src/request-self-service-read.ts'
      - 'src/admin-actions-v2.ts'
      - 'src/domain.ts'
      - 'src/index.ts'
      - 'migrations/0029_request_self_service.sql'
      - 'public/app/request-self-service-ui-v2.js'
      - 'public/app/request-self-service-ui.css'
      - 'public/app/view-requests-account.js'
      - 'public/app/notification-deeplink.js'
      - 'public/app/index.html'
      - 'scripts/audit-request-self-service.mjs'
      - 'tests/request-self-service.spec.mjs'
      - '.github/workflows/request-self-service.yml'
  push:
    branches: [main]
    paths:
      - 'src/request-self-service.ts'
      - 'src/request-self-service-finalize.ts'
      - 'src/request-self-service-read.ts'
      - 'src/admin-actions-v2.ts'
      - 'src/domain.ts'
      - 'src/index.ts'
      - 'migrations/0029_request_self_service.sql'
      - 'public/app/request-self-service-ui-v2.js'
      - 'public/app/request-self-service-ui.css'
      - 'public/app/view-requests-account.js'
      - 'public/app/notification-deeplink.js'
      - 'public/app/index.html'
      - 'scripts/audit-request-self-service.mjs'
      - 'tests/request-self-service.spec.mjs'
      - '.github/workflows/request-self-service.yml'

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prepare:vendor
      - name: TypeScript
        run: npm run typecheck
      - name: Self-service audit
        run: node scripts/audit-request-self-service.mjs
      - name: Validate full D1 migration chain
        run: npx wrangler d1 migrations apply DB --local
      - name: Check request UI syntax
        run: |
          node --check public/app/request-self-service-ui-v2.js
          node --check public/app/view-requests-account.js
          node --check public/app/notification-deeplink.js
      - name: Verify assets are wired
        run: |
          test -f src/request-self-service-finalize.ts
          test -f public/app/request-self-service-ui-v2.js
          test -f public/app/request-self-service-ui.css
          test -f migrations/0029_request_self_service.sql
          grep -q '/app/request-self-service-ui-v2.js?v=20260812-self2' public/app/index.html
          grep -q '/app/request-self-service-ui.css?v=20260812-self2' public/app/index.html
